name: validate

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate package
        shell: pwsh
        run: ./tests/validate-package.ps1
      - name: Installation smoke test
        shell: pwsh
        run: ./tests/install-smoke.ps1
