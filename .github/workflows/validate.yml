name: validate

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  windows-powershell7:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate package
        shell: pwsh
        run: ./tests/validate-package.ps1
      - name: Installation smoke test
        shell: pwsh
        run: ./tests/install-smoke.ps1
      - name: Security regression test
        shell: pwsh
        run: ./tests/security-regression.ps1
  windows-powershell51:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate and regress under Windows PowerShell 5.1
        shell: powershell
        run: |
          ./tests/validate-package.ps1
          ./tests/install-smoke.ps1
          ./tests/security-regression.ps1
